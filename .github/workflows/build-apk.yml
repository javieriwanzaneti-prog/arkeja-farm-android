name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Add Android Platform & Sync
      run: |
        npx cap add android || true
        npx cap sync

    # --- BAGIAN PEMBUAT IKON OTOMATIS ---
    - name: Generate Custom App Icons
      run: |
        npm install -g @capacitor/assets
        # Perintah di bawah ini hanya memotong gambar tanpa menambahkan warna latar
        capacitor-assets generate --android
    # ------------------------------------

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArkejaFarm-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
