name: Build Android APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Web Files from ZIP
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "Error: Tidak ada file ZIP ditemukan di root repositori."
          exit 1
        fi
        mkdir -p www
        unzip -o "$ZIP_FILE" -d www
        rm "$ZIP_FILE"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: actions/setup-android@v3

    - name: Install Capacitor & Init Project
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Arkeja Farm" "com.arkeja.farm" --web-dir www
        npx cap add android
        npx cap sync

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArkejaFarm-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
